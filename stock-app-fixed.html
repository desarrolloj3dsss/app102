<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- jspdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { padding-top: 4rem; }
        .sticky-top { z-index: 1020; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Stock App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#products-tab" data-bs-toggle="tab">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#clients-tab" data-bs-toggle="tab">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#sales-tab" data-bs-toggle="tab">Ventas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="tab-content" id="myTabContent">
            <!-- Products Tab -->
            <div class="tab-pane fade show active" id="products-tab" role="tabpanel" aria-labelledby="products-tab">
                <h2>Productos</h2>
                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#productModal"><i class="bi bi-plus-lg"></i> Nuevo Producto</button>
                <table class="table table-striped">
                    <thead><tr><th>Código</th><th>Descripción</th><th>Costo</th><th>Precio Venta</th><th>Stock</th><th>Acciones</th></tr></thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>

            <!-- Clients Tab -->
            <div class="tab-pane fade" id="clients-tab" role="tabpanel" aria-labelledby="clients-tab">
                <h2>Clientes</h2>
                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#clientModal"><i class="bi bi-plus-lg"></i> Nuevo Cliente</button>
                <table class="table table-striped">
                    <thead><tr><th>Nombre</th><th>Deuda</th><th>Acciones</th></tr></thead>
                    <tbody id="clientsTableBody"></tbody>
                </table>
            </div>

            <!-- Sales Tab -->
            <div class="tab-pane fade" id="sales-tab" role="tabpanel" aria-labelledby="sales-tab">
                <h2>Nueva Venta</h2>
                <form id="saleForm">
                    <div class="row mb-3">
                        <div class="col-md-4"><label for="clientSelect" class="form-label">Cliente</label><select class="form-select" id="clientSelect" required><option value="">Seleccione un cliente</option></select></div>
                        <div class="col-md-4"><label for="productSelect" class="form-label">Producto</label><select class="form-select" id="productSelect" required><option value="">Seleccione un producto</option></select></div>
                        <div class="col-md-2"><label for="quantity" class="form-label">Cantidad</label><input type="number" class="form-control" id="quantity" min="1" value="1"></div>
                        <div class="col-md-2"><button type="button" class="btn btn-success w-100" id="addToCartBtn"><i class="bi bi-cart-plus"></i> Agregar</button></div>
                    </div>

                    <div class="mb-3">
                        <label for="paymentMethod" class="form-label">Método de Pago</label>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="paymentMethod" id="paymentCash" value="cash" checked><label class="form-check-label" for="paymentCash">Contado</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="paymentMethod" id="paymentCredit" value="credit"><label class="form-check-label" for="paymentCredit">Crédito</label></div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered" id="cartTable">
                            <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio Unit.</th><th>Subtotal</th><th>Acciones</th></tr></thead>
                            <tbody id="cartTableBody"></tbody>
                        </table>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6"><h5>Resumen</h5><div id="saleSummary"><p>Subtotal: <span id="subtotal">$0.00</span></p><p>Interés (10%): <span id="interest">$0.00</span></p><p>Total: <span id="total">$0.00</span></p></div></div>
                        <div class="col-md-6 text-md-end"><button type="submit" class="btn btn-primary btn-lg" id="processSaleBtn"><i class="bi bi-check-lg"></i> Procesar Venta</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="productForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalLabel">Nuevo Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3"><label for="productCode" class="form-label">Código</label><input type="text" class="form-control" id="productCode" required></div>
                        <div class="mb-3"><label for="productDesc" class="form-label">Descripción</label><input type="text" class="form-control" id="productDesc" required></div>
                        <div class="mb-3"><label for="productCost" class="form-label">Costo</label><input type="number" class="form-control" id="productCost" step="0.01" min="0" required></div>
                        <div class="mb-3"><label for="productPrice" class="form-label">Precio de Venta</label><input type="number" class="form-control" id="productPrice" step="0.01" min="0" required></div>
                        <div class="mb-3"><label for="productStock" class="form-label">Stock Inicial</label><input type="number" class="form-control" id="productStock" min="0" required></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Client Modal -->
    <div class="modal fade" id="clientModal" tabindex="-1" aria-labelledby="clientModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="clientForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="clientModalLabel">Nuevo Cliente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3"><label for="clientName" class="form-label">Nombre</label><input type="text" class="form-control" id="clientName" required></div>
                        <div class="mb-3"><label for="clientDebt" class="form-label">Deuda Inicial</label><input type="number" class="form-control" id="clientDebt" step="0.01" min="0" value="0"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main App Logic -->
    <script>
        // DOM Elements
        const productsTableBody = document.getElementById('productsTableBody');
        const clientsTableBody = document.getElementById('clientsTableBody');
        const clientSelect = document.getElementById('clientSelect');
        const productSelect = document.getElementById('productSelect');
        const cartTableBody = document.getElementById('cartTableBody');
        const productForm = document.getElementById('productForm');
        const clientForm = document.getElementById('clientForm');
        const saleForm = document.getElementById('saleForm');
        const addToCartBtn = document.getElementById('addToCartBtn');
        const processSaleBtn = document.getElementById('processSaleBtn');
        const subtotalEl = document.getElementById('subtotal');
        const interestEl = document.getElementById('interest');
        const totalEl = document.getElementById('total');

        // Data storage
        let products = [];
        let clients = [];
        let cart = [];

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            loadSampleData();
            renderProducts();
            renderClients();
            renderClientSelect();
            renderProductSelect();
            updateCart();
            
            // Event listeners
            productForm.addEventListener('submit', handleProductSubmit);
            clientForm.addEventListener('submit', handleClientSubmit);
            saleForm.addEventListener('submit', handleSaleSubmit);
            addToCartBtn.addEventListener('click', addToCart);
        });

        // Load sample data
        function loadSampleData() {
            products = [
                { id: 1, code: 'PROD001', description: 'Producto A', cost: 10.00, price: 15.00, stock: 100 },
                { id: 2, code: 'PROD002', description: 'Producto B', cost: 20.00, price: 30.00, stock: 50 },
                { id: 3, code: 'PROD003', description: 'Producto C', cost: 5.00, price: 8.00, stock: 200 }
            ];
            
            clients = [
                { id: 1, name: 'Cliente 1', debt: 0.00 },
                { id: 2, name: 'Cliente 2', debt: 50.00 },
                { id: 3, name: 'Cliente 3', debt: 0.00 }
            ];
        }

        // Render products table
        function renderProducts() {
            productsTableBody.innerHTML = '';
            products.forEach(product => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${product.code}</td>
                    <td>${product.description}</td>
                    <td>$${product.cost.toFixed(2)}</td>
                    <td>$${product.price.toFixed(2)}</td>
                    <td>${product.stock}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editProduct(${product.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                productsTableBody.appendChild(tr);
            });
        }

        // Render clients table
        function renderClients() {
            clientsTableBody.innerHTML = '';
            clients.forEach(client => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${client.name}</td>
                    <td>$${client.debt.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editClient(${client.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteClient(${client.id})"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                clientsTableBody.appendChild(tr);
            });
        }

        // Render client select dropdown
        function renderClientSelect() {
            clientSelect.innerHTML = '<option value="">Seleccione un cliente</option>';
            clients.forEach(client => {
                const option = document.createElement('option');
                option.value = client.id;
                option.textContent = `${client.name} (Deuda: $${client.debt.toFixed(2)})`;
                if (client.debt > 0) {
                    option.style.color = 'red';
                    option.style.fontWeight = 'bold';
                }
                clientSelect.appendChild(option);
            });
        }

        // Render product select dropdown
        function renderProductSelect() {
            productSelect.innerHTML = '<option value="">Seleccione un producto</option>';
            products.forEach(product => {
                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = `${product.description} (${product.code}) - Stock: ${product.stock}`;
                productSelect.appendChild(option);
            });
        }

        // Handle product form submission
        function handleProductSubmit(e) {
            e.preventDefault();
            
            const code = document.getElementById('productCode').value.trim();
            const description = document.getElementById('productDesc').value.trim();
            const cost = parseFloat(document.getElementById('productCost').value);
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);
            
            if (!code || !description || isNaN(cost) || isNaN(price) || isNaN(stock)) {
                alert('Por favor complete todos los campos');
                return;
            }
            
            if (products.some(p => p.code === code)) {
                alert('Ya existe un producto con ese código');
                return;
            }
            
            const newProduct = {
                id: Date.now(),
                code,
                description,
                cost,
                price,
                stock
            };
            
            products.push(newProduct);
            renderProducts();
            renderProductSelect();
            
            const productModal = bootstrap.Modal.getInstance(document.getElementById('productModal'));
            productModal.hide();
            productForm.reset();
        }

        // Handle client form submission
        function handleClientSubmit(e) {
            e.preventDefault();
            
            const name = document.getElementById('clientName').value.trim();
            const debt = parseFloat(document.getElementById('clientDebt').value);
            
            if (!name || isNaN(debt)) {
                alert('Por favor complete todos los campos');
                return;
            }
            
            const newClient = {
                id: Date.now(),
                name,
                debt
            };
            
            clients.push(newClient);
            renderClients();
            renderClientSelect();
            
            const clientModal = bootstrap.Modal.getInstance(document.getElementById('clientModal'));
            clientModal.hide();
            clientForm.reset();
        }

        // Handle adding product to cart
        function addToCart() {
            const productId = parseInt(productSelect.value);
            const quantity = parseInt(document.getElementById('quantity').value);
            
            if (isNaN(productId) || isNaN(quantity) || quantity <= 0) {
                alert('Por favor seleccione un producto y cantidad válida');
                return;
            }
            
            const product = products.find(p => p.id === productId);
            if (!product) {
                alert('Producto no encontrado');
                return;
            }
            
            if (quantity > product.stock) {
                alert(`No hay suficiente stock. Disponible: ${product.stock}`);
                return;
            }
            
            const existingItem = cart.find(item => item.product.id === productId);
            if (existingItem) {
                if (existingItem.quantity + quantity <= product.stock) {
                    existingItem.quantity += quantity;
                } else {
                    alert(`No hay suficiente stock para agregar esa cantidad. Disponible: ${product.stock - existingItem.quantity}`);
                    return;
                }
            } else {
                cart.push({ product, quantity });
            }
            
            updateCart();
            document.getElementById('quantity').value = 1;
        }

        // Update cart table and summary
        function updateCart() {
            cartTableBody.innerHTML = '';
            
            let subtotal = 0;
            
            cart.forEach((item, index) => {
                const subtotalItem = item.product.price * item.quantity;
                subtotal += subtotalItem;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.product.description}</td>
                    <td>${item.quantity}</td>
                    <td>$${item.product.price.toFixed(2)}</td>
                    <td>$${subtotalItem.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="updateCartQuantity(${index}, ${item.quantity - 1})"><i class="bi bi-dash"></i></button>
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="updateCartQuantity(${index}, ${item.quantity + 1})"><i class="bi bi-plus"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${index})"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                cartTableBody.appendChild(tr);
            });
            
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const interest = paymentMethod === 'credit' ? subtotal * 0.10 : 0;
            const total = subtotal + interest;
            
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            interestEl.textContent = `$${interest.toFixed(2)}`;
            totalEl.textContent = `$${total.toFixed(2)}`;
        }

        // Update cart quantity
        function updateCartQuantity(index, newQuantity) {
            if (newQuantity < 1) {
                removeFromCart(index);
                return;
            }
            
            const item = cart[index];
            if (newQuantity > item.product.stock) {
                alert(`No hay suficiente stock. Disponible: ${item.product.stock}`);
                return;
            }
            
            item.quantity = newQuantity;
            updateCart();
        }

        // Remove item from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        // Handle sale form submission
        function handleSaleSubmit(e) {
            e.preventDefault();
            
            if (cart.length === 0) {
                alert('El carrito está vacío');
                return;
            }
            
            const clientId = parseInt(clientSelect.value);
            if (isNaN(clientId)) {
                alert('Por favor seleccione un cliente');
                return;
            }
            
            const client = clients.find(c => c.id === clientId);
            if (!client) {
                alert('Cliente no encontrado');
                return;
            }
            
            // Calculate totals
            let subtotal = 0;
            cart.forEach(item => {
                subtotal += item.product.price * item.quantity;
            });
            
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const interest = paymentMethod === 'credit' ? subtotal * 0.10 : 0;
            const total = subtotal + interest;
            
            // Update client debt if credit sale
            if (paymentMethod === 'credit') {
                client.debt += total;
                
                // Check if over 15 days (simplified: if client had prior debt, add extra 5%)
                // In a real app, you would track the date of last purchase
                if (client.debt - total > 0) { // Had previous debt before this sale
                    const extraInterest = subtotal * 0.05; // Additional 5%
                    client.debt += extraInterest;
                    // Update display to show both interests
                    interestEl.textContent = `$${(interest + extraInterest).toFixed(2)}`;
                    totalEl.textContent = `$${(subtotal + interest + extraInterest).toFixed(2)}`;
                }
            }
            
            // Update product stock
            cart.forEach(item => {
                const product = products.find(p => p.id === item.product.id);
                if (product) {
                    product.stock -= item.quantity;
                }
            });
            
            // Generate PDF receipt
            generateReceipt(client, cart, subtotal, interest, total, paymentMethod);
            
            // Reset form
            cart = [];
            updateCart();
            clientSelect.value = '';
            renderClients();
            renderProducts();
            renderClientSelect();
            renderProductSelect();
            
            alert('Venta procesada correctamente. Se ha generado el recibo.');
        }

        // Generate PDF receipt using jspdf
        function generateReceipt(client, items, subtotal, interest, total, paymentMethod) {
            // Initialize jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Set up the document
            doc.setFontSize(16);
            doc.text('STOCK APP - RECIBO DE VENTA', 20, 20);
            doc.setFontSize(12);
            doc.text('=============================', 20, 30);
            
            let yPosition = 40;
            doc.text(`Cliente: ${client.name}`, 20, yPosition);
            yPosition += 10;
            doc.text(`Fecha: ${new Date().toLocaleString()}`, 20, yPosition);
            yPosition += 10;
            doc.text(`Método de pago: ${paymentMethod === 'credit' ? 'Crédito' : 'Contado'}`, 20, yPosition);
            yPosition += 20;
            
            doc.text('PRODUCTOS:', 20, yPosition);
            yPosition += 10;
            doc.text('-----------------------------', 20, yPosition);
            yPosition += 10;
            
            items.forEach(item => {
                doc.text(`${item.product.description}`, 20, yPosition);
                yPosition += 7;
                doc.text(`  Cantidad: ${item.quantity} x $${item.product.price.toFixed(2)} = $${(item.product.price * item.quantity).toFixed(2)}`, 25, yPosition);
                yPosition += 7;
                doc.text(`  Código: ${item.product.code}`, 25, yPosition);
                yPosition += 10;
            });
            
            yPosition += 5;
            doc.text('-----------------------------', 20, yPosition);
            yPosition += 10;
            doc.text(`Subtotal: $${subtotal.toFixed(2)}`, 20, yPosition);
            yPosition += 10;
            if (paymentMethod === 'credit') {
                doc.text(`Interés (10%): $${interest.toFixed(2)}`, 20, yPosition);
                yPosition += 10;
            }
            doc.text(`TOTAL: $${total.toFixed(2)}`, 20, yPosition);
            yPosition += 20;
            doc.text('¡Gracias por su compra!', 20, yPosition);
            yPosition += 10;
            doc.text('Conserve este comprobante para cualquier reclamo.', 20, yPosition);
            
            // Save the PDF
            doc.save(`recibo_${client.name.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        // Edit product (simplified)
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            document.getElementById('productCode').value = product.code;
            document.getElementById('productDesc').value = product.description;
            document.getElementById('productCost').value = product.cost;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock;
            
            const productModal = new bootstrap.Modal(document.getElementById('productModal'));
            productModal.show();
            
            alert('En una aplicación completa, esto abriría el formulario para editar el producto\n\nPor ahora, puede modificar los valores y agregar como nuevo producto');
        }

        // Edit client (simplified)
        function editClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;
            
            document.getElementById('clientName').value = client.name;
            document.getElementById('clientDebt').value = client.debt;
            
            const clientModal = new bootstrap.Modal(document.getElementById('clientModal'));
            clientModal.show();
            
            alert('En una aplicación completa, esto abriría el formulario para editar el cliente\n\nPor ahora, puede modificar los valores y agregar como nuevo cliente');
        }

        // Delete product
        function deleteProduct(id) {
            if (!confirm('¿Está seguro de eliminar este producto?')) return;
            
            products = products.filter(p => p.id !== id);
            renderProducts();
            renderProductSelect();
        }

        // Delete client
        function deleteClient(id) {
            if (!confirm('¿Está seguro de eliminar este cliente?')) return;
            
            clients = clients.filter(c => c.id !== id);
            renderClients();
            renderClientSelect();
        }
    </script>
</body>
</html>
